<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0F19" />
    <title>Hors connexion | TGI Ascenseurs</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; background: #f8fafc; color: #0f172a; font: 16px/1.6 Inter, system-ui, sans-serif; }
      main { max-width: 32rem; padding: 2rem; border: 1px solid #e2e8f0; border-radius: 1rem; background: #fff; text-align: center; box-shadow: 0 8px 24px rgb(15 23 42 / .06); }
      h1 { margin: .5rem 0; font-size: 1.5rem; }
      p { color: #475569; }
      button { min-height: 2.75rem; padding: 0 1rem; border: 0; border-radius: .75rem; background: #2563eb; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p>TGI ASCENSEURS</p>
      <h1>Vous êtes hors connexion</h1>
      <p>Les données ne sont pas disponibles sans réseau. Rétablissez votre connexion puis réessayez.</p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </main>
  </body>
</html>
